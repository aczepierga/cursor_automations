name: Flight tracker Tromsø

on:
  schedule:
    - cron: "17 5 * * *" # codziennie ok. 7:17 czasu polskiego
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: flight-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r flight-tracker/requirements.txt

      - name: Check prices
        id: track
        run: python flight-tracker/tracker.py

      - name: Commit report
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "flight-tracker-bot@users.noreply.github.com"
          git add flight-tracker/REPORT.md flight-tracker/data
          git commit -m "Flight tracker: aktualizacja cen $(date -u +%F)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Notify about price change
        if: steps.track.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          TITLE="Tracker lotów do Tromsø"
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          { echo "@${OWNER}"; echo; cat flight-tracker/alert.md; } > /tmp/body.md
          if [ -z "$NUM" ]; then
            gh issue create --title "$TITLE" --body-file /tmp/body.md
          else
            gh issue comment "$NUM" --body-file /tmp/body.md
          fi
